name: apple

on:
  pull_request:
    paths:
      - "Package.swift"
      - "apple/**"
      - ".github/workflows/apple.yml"
  push:
    branches: [main]
    paths:
      - "Package.swift"
      - "apple/**"
      - ".github/workflows/apple.yml"

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (macOS) + iOS Simulator build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Build and test (macOS)
        run: swift test
      - name: Build for iOS Simulator
        run: xcodebuild -scheme BankaiLibrary-Package -destination 'generic/platform=iOS Simulator' build
